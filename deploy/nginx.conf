# Static file server for the built app (one index.html plus a few files).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Health check for the self-deploy script.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page and the offline helper must never be cached for long,
    # so the iPad picks up a new version as soon as it is online.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri =404;
    }
}
